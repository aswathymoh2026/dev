name: Devops demo 1

on:
  push:
    branches:
      - main
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # IMPORTANT: Connect workflow to your GitHub Environment
    environment: AZ_CLI_ID

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Azure Secrets
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          [ -n "$CLIENT_ID" ] && echo "Client ID is set" || echo "Client ID is MISSING"
          [ -n "$TENANT_ID" ] && echo "Tenant ID is set" || echo "Tenant ID is MISSING"

      - name: Azure Login using Service Principal
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Display files
        run: ls -la

      - name: Run test
        run: |
          echo "Running the test!"
          test -f index.html

      - name: Create Resource Group
        run: |
          echo "Creating Resource Group..."
          az group create \
            --name devops-demo-rg \
            --location canadacentral

      - name: Build stage
        run: echo "Running the build!"
