name: Devops demo 1

on:
  push:
    branches:
      - main
      - dev

# Required for Azure OIDC login
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login using Service Principal
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Display files
        run: ls -la

      - name: Run test
        run: |
          echo "Running the test!"
          test -f index.html

      - name: Create Resource Group
        run: |
          echo "Creating Resource Group..."
          az group create \
            --name devops-demo-rg \
            --location canadacentral

      - name: Build stage
        run: echo "Running the build!"
